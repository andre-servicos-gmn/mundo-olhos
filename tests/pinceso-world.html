<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste — pinceso no mundo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2440; }
  #hud { position: fixed; left: 10px; top: 8px; font: 13px monospace; color: #fff; text-shadow: 0 1px 2px #000; white-space: pre; }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }
</script>
</head>
<body>
<div id="root"></div>
<div id="hud"></div>
<script type="module">
// Integração: world real + Quim + Pinceso (sem UI/NPCs/missões). Roteiro do "Filhote Sem Ninho" no Ninhal.
// URL: ?pos=x,z  ?time=0.4  ?quality=baixa|media|alta  ?pinceso (já acompanha)
import * as THREE from 'three';
import { createBus } from '../src/core/bus.js';
import { defaultState } from '../src/core/state.js';
import { createInput } from '../src/core/input.js';
import { createInteractables } from '../src/core/interact.js';
import { SPOTS } from '../src/data/worldmap.js';
import { createRender } from '../src/render/render.js';
import { createWorld } from '../src/world/world.js';
import { createPlayer } from '../src/player/player.js';
import { createCameraRig } from '../src/player/camera.js';
import { createPinceso } from '../src/pinceso/pinceso.js';

const params = new URLSearchParams(location.search);
const hud = document.getElementById('hud');
const state = defaultState();
state.settings.quality = params.get('quality') || 'media';
if (params.get('time')) state.dayTime = Number(params.get('time'));
state.pincesoJoined = params.has('pinceso');
const voices = [];
const game = {
  THREE, params, bus: createBus(), state, interactables: createInteractables(), findables: new Set(),
  paused: false, cinematic: false, time: { elapsed: 0 },
  ui: { toast: () => {}, setPrompt: () => {} },
  audio: { play: () => {}, quimVoice: () => {}, pincesoVoice: (n) => voices.push(n) },
};
game.render = createRender(game, document.getElementById('root'));
game.render.setQuality(state.settings.quality);
game.input = createInput(game.render.renderer.domElement);
game.world = createWorld(game);
await game.world.build((p, t) => { hud.textContent = `${Math.round(p * 100)}% ${t}`; });
for (const r of game.world.regionIds()) state.regionColor[r] = 1;
const pos = params.get('pos');
if (pos) { const [x, z] = pos.split(',').map(Number); state.player = { x, y: game.world.getHeight(x, z), z, rotY: 0 }; }
game.world.applyState();
game.render.dayTime = state.dayTime;
game.player = createPlayer(game);
game.cameraRig = createCameraRig(game);
game.player.applyState();
game.cameraRig.snap();
game.pinceso = createPinceso(game);
game.pinceso.applyState();
await game.render.warmup?.();

function step(n, keys = [], dt = 1 / 60) {
  for (let i = 0; i < n; i++) {
    for (const k of keys) game.input.simulate(k, true);
    game.time.elapsed += dt;
    game.render.update(dt);
    game.player.update(dt);
    game.pinceso.update(dt);
    game.world.update(dt);
    game.cameraRig.update(dt);
    game.input.endFrame();
  }
  for (const k of keys) game.input.simulate(k, false);
}
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 1 / 20);
  if (!window.__manual) step(1, [], dt);
  game.render.render();
  const p = game.pinceso.position;
  hud.textContent = `pinceso ${game.pinceso.mode}/${game.pinceso.action} · ${p.x.toFixed(1)}, ${p.y.toFixed(2)}, ${p.z.toFixed(1)} · chão ${game.world.getHeight(p.x, p.z).toFixed(2)}`;
}
frame();
window.__game = Object.assign(game, { ready: true, step, voices, SPOTS });
</script>
</body>
</html>
